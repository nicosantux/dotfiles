config-version = 2

start-at-login = true
automatically-unhide-macos-hidden-apps = true

persistent-workspaces = ["1", "2", "3", "4", "5"]

exec-on-workspace-change = [
  '/bin/bash',
  '-c',
  'sketchybar --trigger aerospace_workspace_change AEROSPACE_FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE AEROSPACE_PREV_WORKSPACE=$AEROSPACE_PREV_WORKSPACE'
]

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
on-focus-changed = ['move-mouse window-lazy-center']

[gaps]
inner.horizontal = 12
inner.vertical =   12
outer.left =       12
outer.bottom =     12
outer.top =        [{ monitor.'^built-in retina display$' = 12 }, 42]
outer.right =      12

[mode.main.binding]
alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'

cmd-ctrl-shift-alt-h = 'focus left'
cmd-ctrl-shift-alt-j = 'focus down'
cmd-ctrl-shift-alt-k = 'focus up'
cmd-ctrl-shift-alt-l = 'focus right'

alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

alt-shift-minus = 'resize smart -50'
alt-shift-equal = 'resize smart +50'

cmd-ctrl-shift-alt-1 = 'workspace 1'
cmd-ctrl-shift-alt-2 = 'workspace 2'
cmd-ctrl-shift-alt-3 = 'workspace 3'
cmd-ctrl-shift-alt-4 = 'workspace 4'
cmd-ctrl-shift-alt-5 = 'workspace 5'
cmd-ctrl-shift-alt-6 = 'workspace 6'
cmd-ctrl-shift-alt-7 = 'workspace 7'
cmd-ctrl-shift-alt-8 = 'workspace 8'
cmd-ctrl-shift-alt-9 = 'workspace 9'

alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-6 = 'move-node-to-workspace 6'
alt-shift-7 = 'move-node-to-workspace 7'
alt-shift-8 = 'move-node-to-workspace 8'
alt-shift-9 = 'move-node-to-workspace 9'

cmd-ctrl-shift-alt-tab = 'workspace-back-and-forth'
cmd-ctrl-shift-alt-d = 'move-workspace-to-monitor --wrap-around next'
cmd-ctrl-shift-alt-space = 'layout floating tiling' # Toggle between floating and tiling layout
alt-shift-semicolon = 'mode service'

[[on-window-detected]]
if.app-name-regex-substring = 'finder|telegram|whatsapp|notes'
run = 'layout floating'

[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main'] # reset layout
backspace = ['close-all-windows-but-current', 'mode main']

alt-shift-h = ['join-with left', 'mode main']
alt-shift-j = ['join-with down', 'mode main']
alt-shift-k = ['join-with up', 'mode main']
alt-shift-l = ['join-with right', 'mode main']
