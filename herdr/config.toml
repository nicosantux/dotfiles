# herdr configuration
# Place this file at ~/.config/herdr/config.toml
onboarding = false

[theme]
name = "catppuccin"
dark_name = "catppuccin"
light_name = "catppuccin-latte"
auto_switch = true

[terminal]
new_cwd = "follow"

[update]
channel = "stable"
version_check = true
manifest_check = true

[keys]
prefix = "ctrl+a"
copy_mode = "ctrl+b"
detach = "prefix+d"
zoom = "prefix+m"

[ui]
sidebar_collapsed_mode = "compact"
mouse_capture = true
prompt_new_tab_name = false
pane_gaps = false
agent_panel_sort = "priority"
show_agent_labels_on_pane_borders = true
status_indicators = "symbols"

[ui.sidebar.agents]
row_gap = 0
rows = [
  [
    "state_icon",
    { token = "terminal_title_stripped", dim = false },
  ],
  [
    { token = "workspace", dim = false, bold = false },
  ],
]

[ui.sidebar.spaces]
row_gap = 0
rows = [["state_icon", "workspace", "branch", "git_status"]]

[ui.toast]
delivery = "system"

[keys.indexed]
workspaces = "ctrl"
agents = "ctrl+shift"

[[keys.command]]
key = "prefix+p"
type = "popup"
command = "zsh"
height = "80%"
width = "90%"
description = "floating terminal"

# Plugins
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "navigate right (vim/herdr)"
